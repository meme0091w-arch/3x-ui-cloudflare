name = "3x-ui-cf"
main = "worker/src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers Builds / Wrangler automatic provisioning is enabled by default.
# Leave account-specific IDs out of this repository so the GitHub deployment can
# provision and link fresh D1/KV resources to this Worker automatically.
[[d1_databases]]
binding = "DB"
database_name = "3x-ui-cf-db"
 database_id = "e684201f-5f4b-4f11-b374-2ee2da8fa913"
migrations_dir = "worker/migrations"

# KV namespaces are provisioned automatically on first deployment.
# Do not commit account-specific namespace IDs.
[[kv_namespaces]]
binding = "SESSIONS"
 id = "18105a75850540aca2ea58e784af22fd"

[[kv_namespaces]]
binding = "CACHE"
 id = "ad3a9bec08c5430d8d78833fda1e7eda"

[assets]
directory = "frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Daily housekeeping: prunes logs past `retention_days`, drops leaked
# connection_state rows and expired sessions, and flips lapsed accounts to
# `expired`. Without it nothing in this panel ever deletes anything.
[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = true